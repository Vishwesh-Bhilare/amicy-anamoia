<svg width="960" height="560" viewBox="0 0 960 560" xmlns="http://www.w3.org/2000/svg" font-family="IBM Plex Mono, monospace">
<rect width="960" height="560" fill="#1c1c1e"/>
<defs>
<pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse">
<circle cx="1" cy="1" r="0.6" fill="rgba(255,255,255,0.04)"/>
</pattern>
</defs>
<rect width="960" height="560" fill="url(#dots)"/>

<line x1="0" y1="52" x2="960" y2="52" stroke="#3a362f" stroke-width="1"/>
