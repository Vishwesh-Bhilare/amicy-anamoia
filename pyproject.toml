[project]
name = "pt"
version = "0.1.0"
description = "Local-first CLI + web project tracker"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12.0",
    "pyyaml>=6.0",
    "pydantic>=2.6",
    "rich>=13.7.0",
    "python-dateutil>=2.9.0",
]

[project.scripts]
pt = "pt.cli:app"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pt*"]
